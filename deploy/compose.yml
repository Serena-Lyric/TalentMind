name: talentmind

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"

services:
  mysql:
    image: mysql:8.0
    env_file:
      - ${TALENTMIND_ENV_FILE:-.env}
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: talentmind
      MYSQL_USER: talentmind
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - type: bind
        source: ${TALENTMIND_DATA_DIR}/mysql
        target: /var/lib/mysql
      - ./mysql/my.cnf:/etc/mysql/conf.d/talentmind.cnf:ro
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 1g

  backend:
    image: talentmind-backend:${TALENTMIND_VERSION:-dev}
    env_file:
      - ${TALENTMIND_ENV_FILE:-.env}
    environment:
      MYSQL_URL: mysql+pymysql://talentmind:${MYSQL_PASSWORD}@mysql:3306/talentmind
      NEO4J_URI: ${NEO4J_URI:-bolt://neo4j:7687}
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-}
      TALENTMIND_LOCAL_RAW: "1"
      TALENTMIND_TRUSTED_PROXY_SECRET: ${TALENTMIND_TRUSTED_PROXY_SECRET}
      TALENTMIND_M2_CONFIG: /app/deploy/m2/config.json
      TALENTMIND_M2_KEY_FILE: /app/deploy/m2/api-key.txt
    ports:
      # noVNC stays on host loopback only; reach it through an SSH tunnel.
      - "127.0.0.1:6080:6080"
    volumes:
      - type: bind
        source: ${TALENTMIND_DATA_DIR}/backend
        target: /app/data/local
      - ./m2:/app/deploy/m2:ro
    networks: [data, edge]
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18000/health')"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 1500m

  web:
    image: talentmind-web:${TALENTMIND_VERSION:-dev}
    ports:
      - "${TALENTMIND_HTTP_PORT:-80}:80"
      - "${TALENTMIND_HTTPS_PORT:-443}:443"
    volumes:
      - type: bind
        source: ${TALENTMIND_NGINX_DIR:-./nginx}
        target: /etc/nginx/conf.d
        read_only: true
      - type: bind
        source: ${TALENTMIND_AUTH_DIR:-./auth}
        target: /etc/nginx/auth
        read_only: true
      - type: bind
        source: ${TALENTMIND_TLS_DIR:-./tls}
        target: /etc/nginx/tls
        read_only: true
    networks: [edge]
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 128m

  neo4j:
    image: neo4j:5-community
    profiles: ["graph-db"]
    env_file:
      - ${TALENTMIND_ENV_FILE:-.env}
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    volumes:
      - type: bind
        source: ${TALENTMIND_DATA_DIR}/neo4j
        target: /data
    networks: [data]
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 1g

  redis:
    image: redis:7-alpine
    profiles: ["cache"]
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    networks: [data]
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 256m

networks:
  edge:
  data:
