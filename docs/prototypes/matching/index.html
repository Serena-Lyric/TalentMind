<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>人岗匹配系统</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        :root {
            --primary: #4F46E5;
            --primary-light: #818CF8;
            --primary-dark: #3730A3;
            --accent: #06B6D4;
            --bg-primary: #FAFBFC;
            --bg-secondary: #F1F5F9;
            --bg-card: #FFFFFF;
            --bg-dark: #0F172A;
            --text-primary: #1E293B;
            --text-secondary: #64748B;
            --text-muted: #94A3B8;
            --success: #10B981;
            --warning: #F59E0B;
            --danger: #EF4444;
            --info: #3B82F6;
            --match-perfect: #10B981;
            --match-good: #3B82F6;
            --match-ok: #F59E0B;
            --match-poor: #EF4444;
            --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
            --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.1);
            --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.1);
            --shadow-xl: 0 20px 25px -5px rgba(0,0,0,0.1);
            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 14px;
            --radius-xl: 20px;
            --transition-fast: 150ms ease;
            --transition-base: 250ms ease;
            --transition-slow: 400ms ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans SC', 'DM Sans', system-ui, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* 顶部导航 */
        .navbar {
            background: var(--bg-card);
            border-bottom: 1px solid #E2E8F0;
            padding: 0 24px;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            box-shadow: var(--shadow-sm);
        }

        .navbar-brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .navbar-brand .logo {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 18px;
            font-weight: 700;
        }

        .navbar-brand h1 {
            font-size: 20px;
            font-weight: 600;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .navbar-actions {
            display: flex;
            gap: 12px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 18px;
            border-radius: var(--radius-md);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all var(--transition-fast);
            border: none;
            font-family: inherit;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            box-shadow: 0 4px 14px rgba(79, 70, 229, 0.35);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(79, 70, 229, 0.45);
        }

        .btn-secondary {
            background: var(--bg-secondary);
            color: var(--text-primary);
            border: 1px solid #E2E8F0;
        }

        .btn-secondary:hover {
            background: #E2E8F0;
        }

        .btn-ghost {
            background: transparent;
            color: var(--text-secondary);
        }

        .btn-ghost:hover {
            background: var(--bg-secondary);
            color: var(--text-primary);
        }

        /* 主布局 */
        .app-container {
            display: flex;
            padding-top: 64px;
            min-height: 100vh;
        }

        /* 侧边栏 */
        .sidebar {
            width: 320px;
            background: var(--bg-card);
            border-right: 1px solid #E2E8F0;
            height: calc(100vh - 64px);
            position: fixed;
            top: 64px;
            left: 0;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .sidebar-section {
            padding: 20px;
            border-bottom: 1px solid #E2E8F0;
        }

        .sidebar-section:last-child {
            border-bottom: none;
            flex: 1;
        }

        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }

        .section-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-title i {
            color: var(--primary);
        }

        .section-count {
            background: var(--bg-secondary);
            padding: 2px 8px;
            border-radius: 20px;
            font-size: 12px;
            color: var(--text-secondary);
        }

        /* 简历/岗位列表项 */
        .list-item {
            padding: 14px;
            background: var(--bg-primary);
            border-radius: var(--radius-md);
            margin-bottom: 10px;
            cursor: pointer;
            transition: all var(--transition-fast);
            border: 2px solid transparent;
        }

        .list-item:hover {
            background: var(--bg-secondary);
        }

        .list-item.active {
            border-color: var(--primary);
            background: rgba(79, 70, 229, 0.05);
        }

        .list-item-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 8px;
        }

        .list-item-avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary-light) 0%, var(--primary) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            font-size: 16px;
            flex-shrink: 0;
        }

        .list-item-info {
            flex: 1;
            min-width: 0;
        }

        .list-item-name {
            font-weight: 600;
            font-size: 14px;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .list-item-subtitle {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        .list-item-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .tag {
            display: inline-flex;
            align-items: center;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 500;
        }

        .tag-language { background: #DBEAFE; color: #1D4ED8; }
        .tag-framework { background: #EDE9FE; color: #7C3AED; }
        .tag-database { background: #D1FAE5; color: #059669; }
        .tag-tool { background: #F3F4F6; color: #6B7280; }
        .tag-soft { background: #FEF3C7; color: #D97706; }
        .tag-default { background: var(--bg-secondary); color: var(--text-secondary); }

        /* 上传区域 */
        .upload-zone {
            border: 2px dashed #CBD5E1;
            border-radius: var(--radius-lg);
            padding: 28px 20px;
            text-align: center;
            cursor: pointer;
            transition: all var(--transition-fast);
            background: var(--bg-primary);
        }

        .upload-zone:hover, .upload-zone.dragover {
            border-color: var(--primary);
            background: rgba(79, 70, 229, 0.03);
        }

        .upload-zone i {
            font-size: 32px;
            color: var(--primary-light);
            margin-bottom: 12px;
        }

        .upload-zone h3 {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 4px;
        }

        .upload-zone p {
            font-size: 12px;
            color: var(--text-muted);
        }

        /* 主内容区 */
        .main-content {
            flex: 1;
            margin-left: 320px;
            padding: 24px;
            min-height: calc(100vh - 64px);
        }

        .content-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
        }

        .content-title {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-primary);
        }

        /* 匹配选择器 */
        .match-selector {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
            background: var(--bg-card);
            padding: 16px;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-sm);
        }

        .selector-group {
            flex: 1;
        }

        .selector-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .selector-group select {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #E2E8F0;
            border-radius: var(--radius-md);
            font-size: 14px;
            font-family: inherit;
            background: var(--bg-primary);
            color: var(--text-primary);
            cursor: pointer;
            transition: all var(--transition-fast);
        }

        .selector-group select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        .match-btn {
            align-self: flex-end;
        }

        /* 结果统计 */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: var(--bg-card);
            padding: 20px;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-sm);
            display: flex;
            align-items: center;
            gap: 16px;
            transition: all var(--transition-fast);
            animation: fadeInUp 0.4s ease backwards;
        }

        .stat-card:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-md);
        }

        .stat-icon {
            width: 48px;
            height: 48px;
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .stat-icon.green { background: #D1FAE5; color: var(--success); }
        .stat-icon.blue { background: #DBEAFE; color: var(--info); }
        .stat-icon.orange { background: #FEF3C7; color: var(--warning); }
        .stat-icon.purple { background: #EDE9FE; color: #7C3AED; }

        .stat-info h4 {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .stat-info p {
            font-size: 13px;
            color: var(--text-secondary);
        }

        /* 匹配结果卡片 */
        .results-grid {
            display: grid;
            gap: 16px;
        }

        .result-card {
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            padding: 24px;
            box-shadow: var(--shadow-sm);
            display: grid;
            grid-template-columns: auto 1fr auto;
            gap: 24px;
            align-items: center;
            transition: all var(--transition-base);
            animation: fadeInUp 0.5s ease backwards;
            border: 1px solid transparent;
        }

        .result-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
            border-color: var(--primary-light);
        }

        .result-rank {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 700;
            color: white;
        }

        .result-rank.gold { background: linear-gradient(135deg, #F59E0B 0%, #D97706 100%); }
        .result-rank.silver { background: linear-gradient(135deg, #94A3B8 0%, #64748B 100%); }
        .result-rank.bronze { background: linear-gradient(135deg, #CD7F32 0%, #A0522D 100%); }
        .result-rank.default { background: var(--bg-secondary); color: var(--text-secondary); }

        .result-info {
            min-width: 0;
        }

        .result-name {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .result-title {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 12px;
        }

        .result-match-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .match-tag {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-family: 'JetBrains Mono', monospace;
        }

        .match-tag.matched {
            background: #D1FAE5;
            color: #059669;
        }

        .match-tag.missed {
            background: #FEE2E2;
            color: #DC2626;
        }

        .match-tag i {
            font-size: 10px;
        }

        /* 匹配度仪表 */
        .match-score {
            text-align: center;
            min-width: 120px;
        }

        .score-ring {
            position: relative;
            width: 100px;
            height: 100px;
            margin: 0 auto 8px;
        }

        .score-ring svg {
            transform: rotate(-90deg);
        }

        .score-ring circle {
            fill: none;
            stroke-width: 8;
        }

        .score-ring .bg {
            stroke: var(--bg-secondary);
        }

        .score-ring .progress {
            stroke-linecap: round;
            transition: stroke-dashoffset 1s ease;
        }

        .score-ring .score-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 26px;
            font-weight: 700;
        }

        .score-label {
            font-size: 13px;
            font-weight: 500;
            padding: 5px 12px;
            border-radius: 20px;
            display: inline-block;
        }

        .score-label.s { background: #D1FAE5; color: #059669; }
        .score-label.a { background: #DBEAFE; color: #1D4ED8; }
        .score-label.b { background: #FEF3C7; color: #D97706; }
        .score-label.c { background: #FEE2E2; color: #DC2626; }

        /* 推荐理由 */
        .recommendation {
            grid-column: 1 / -1;
            background: linear-gradient(135deg, rgba(79, 70, 229, 0.03) 0%, rgba(6, 182, 212, 0.03) 100%);
            border-radius: var(--radius-md);
            padding: 16px 20px;
            margin-top: 8px;
            border-left: 4px solid var(--primary);
        }

        .recommendation h4 {
            font-size: 13px;
            font-weight: 600;
            color: var(--primary);
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .recommendation p {
            font-size: 14px;
            color: var(--text-secondary);
            line-height: 1.6;
        }

        /* 空状态 */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            background: var(--bg-card);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-sm);
        }

        .empty-state i {
            font-size: 64px;
            color: #CBD5E1;
            margin-bottom: 20px;
        }

        .empty-state h3 {
            font-size: 18px;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        .empty-state p {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 20px;
        }

        /* 动画 */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .loading {
            animation: pulse 1.5s infinite;
        }

        /* 详情面板 */
        .detail-panel {
            position: fixed;
            top: 64px;
            right: -450px;
            width: 450px;
            height: calc(100vh - 64px);
            background: var(--bg-card);
            border-left: 1px solid #E2E8F0;
            z-index: 90;
            transition: right var(--transition-base);
            overflow-y: auto;
            box-shadow: var(--shadow-xl);
        }

        .detail-panel.open {
            right: 0;
        }

        .detail-header {
            padding: 24px;
            border-bottom: 1px solid #E2E8F0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            background: var(--bg-card);
            z-index: 1;
        }

        .detail-header h2 {
            font-size: 18px;
            font-weight: 600;
        }

        .detail-close {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: none;
            background: var(--bg-secondary);
            color: var(--text-secondary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all var(--transition-fast);
        }

        .detail-close:hover {
            background: #E2E8F0;
            color: var(--text-primary);
        }

        .detail-content {
            padding: 24px;
        }

        .detail-section {
            margin-bottom: 24px;
        }

        .detail-section h3 {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
        }

        .detail-item {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 10px 0;
            border-bottom: 1px solid #F1F5F9;
        }

        .detail-item:last-child {
            border-bottom: none;
        }

        .detail-item i {
            width: 20px;
            color: var(--primary);
            margin-top: 2px;
        }

        .detail-item span {
            flex: 1;
            font-size: 14px;
            color: var(--text-primary);
        }

        .detail-skills {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        /* 详情卡片 */
        .detail-card {
            background: var(--bg-primary);
            border-radius: var(--radius-md);
            padding: 14px;
            margin-bottom: 12px;
            border-left: 3px solid var(--primary);
        }

        .detail-card:last-child {
            margin-bottom: 0;
        }

        .detail-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .detail-card-header .school,
        .detail-card-header .company,
        .detail-card-header .project-name {
            font-weight: 600;
            color: var(--text-primary);
            font-size: 14px;
        }

        .detail-card-header .degree {
            background: var(--primary);
            color: white;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 500;
        }

        .detail-card-header .time {
            font-size: 12px;
            color: var(--text-muted);
        }

        .detail-card-body {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }

        .detail-card-body .major,
        .detail-card-body .position {
            color: var(--text-secondary);
        }

        .detail-card-desc {
            font-size: 12px;
            color: var(--text-muted);
            padding-top: 8px;
            border-top: 1px dashed #E2E8F0;
        }

        .detail-card-desc p {
            margin: 4px 0;
            line-height: 1.5;
        }

        /* 技能分类 */
        .skill-category {
            margin-bottom: 14px;
        }

        .skill-category:last-child {
            margin-bottom: 0;
        }

        .skill-category-title {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 8px;
            padding-bottom: 4px;
            border-bottom: 1px solid #E2E8F0;
        }

        /* 原始文本 */
        .raw-text {
            background: var(--bg-primary);
            padding: 14px;
            border-radius: var(--radius-md);
            font-size: 12px;
            color: var(--text-secondary);
            white-space: pre-wrap;
            word-break: break-all;
            max-height: 200px;
            overflow-y: auto;
            font-family: 'JetBrains Mono', monospace;
            line-height: 1.6;
        }

        /* Toast 提示 */
        .toast-container {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 1000;
        }

        .toast {
            background: var(--bg-dark);
            color: white;
            padding: 14px 20px;
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-lg);
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 12px;
            animation: slideIn 0.3s ease;
        }

        .toast.success { border-left: 4px solid var(--success); }
        .toast.error { border-left: 4px solid var(--danger); }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(100%);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        /* 响应式 */
        @media (max-width: 1200px) {
            .sidebar {
                width: 280px;
            }
            .main-content {
                margin-left: 280px;
            }
        }

        @media (max-width: 900px) {
            .sidebar {
                transform: translateX(-100%);
            }
            .main-content {
                margin-left: 0;
            }
        }
    </style>
</head>
<body>
    <!-- 顶部导航 -->
    <nav class="navbar">
        <div class="navbar-brand">

    <script>

        // 数据存储
        let resumes = [];
        let jobs = [];
        let matchResults = [];
        let chartInstance = null;

        // 能力维度定义
        const ABILITY_DIMENSIONS = [
            { key: 'languages', label: '编程语言', max: 8, color: 'rgba(79, 70, 229, 0.7)' },
            { key: 'frontend', label: '前端技术', max: 6, color: 'rgba(139, 92, 246, 0.7)' },
            { key: 'backend', label: '后端框架', max: 6, color: 'rgba(6, 182, 212, 0.7)' },
            { key: 'database', label: '数据库', max: 6, color: 'rgba(16, 185, 129, 0.7)' },
            { key: 'devops', label: 'DevOps/云', max: 6, color: 'rgba(245, 158, 11, 0.7)' },
            { key: 'ai', label: 'AI/机器学习', max: 6, color: 'rgba(239, 68, 68, 0.7)' },
            { key: 'software', label: '软件工程', max: 6, color: 'rgba(59, 130, 246, 0.7)' }
        ];

        // 计算能力向量
        function calculateAbilityVector(skillsByCategory) {
            const vector = {};
            // 映射技能分类标签
            const categoryMap = {
                '编程语言': 'languages',
                '前端技术': 'frontend',
                '后端框架': 'backend',
                '数据库': 'database',
                'DevOps/运维': 'devops',
                '云服务': 'devops',
                'AI/机器学习': 'ai',
                '软件工程': 'software'
            };

            ABILITY_DIMENSIONS.forEach(dim => {
                // 根据不同的标签查找技能
                let categoryLabel = null;
                for (const [label, key] of Object.entries(categoryMap)) {
                    if (key === dim.key && skillsByCategory[label]) {
                        categoryLabel = label;
                        break;
                    }
                }
                const categorySkills = categoryLabel ? (skillsByCategory[categoryLabel] || []) : [];
                // 归一化到 0-100
                vector[dim.key] = Math.min(100, Math.round((categorySkills.length / dim.max) * 100));
            });
            return vector;
        }

        // 渲染能力雷达图
        function renderAbilityRadar(containerId, abilityVector, name) {
            const ctx = document.getElementById(containerId);
            if (!ctx) return;

            // 销毁已有图表
            if (chartInstance) {
                chartInstance.destroy();
            }

            const labels = ABILITY_DIMENSIONS.map(d => d.label);
            const data = ABILITY_DIMENSIONS.map(d => abilityVector[d.key] || 0);

            chartInstance = new Chart(ctx, {
                type: 'radar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: name || '能力图谱',
                        data: data,
                        backgroundColor: 'rgba(79, 70, 229, 0.2)',
                        borderColor: 'rgba(79, 70, 229, 0.8)',
                        borderWidth: 2,
                        pointBackgroundColor: 'rgba(79, 70, 229, 1)',
                        pointBorderColor: '#fff',
                        pointRadius: 4,
                        pointHoverRadius: 6
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    scales: {
                        r: {
                            beginAtZero: true,
                            max: 100,
                            ticks: {
                                stepSize: 20,
                                font: { size: 10 },
                                backdropColor: 'transparent'
                            },
                            pointLabels: {
                                font: { size: 11, weight: '500' },
                                color: '#64748B'
                            },
                            grid: {
                                color: 'rgba(0, 0, 0, 0.05)'
                            },
                            angleLines: {
                                color: 'rgba(0, 0, 0, 0.05)'
                            }
                        }
                    },
                    plugins: {
                        legend: {
                            display: false
                        },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    return context.label + ': ' + context.raw + '%';
                                }
                            }
                        }
                    }
                }
            });
        }

        // 技能分类映射
        const skillCategories = {
            'Python': 'language', 'Java': 'language', 'JavaScript': 'language', 'Go': 'language',
            'TypeScript': 'language', 'C++': 'language', 'C#': 'language', 'Rust': 'language',
            'React': 'framework', 'Vue': 'framework', 'Angular': 'framework', 'Next.js': 'framework',
            'Django': 'framework', 'Spring Boot': 'framework', 'Flask': 'framework', 'Gin': 'framework',
            'MySQL': 'database', 'PostgreSQL': 'database', 'MongoDB': 'database', 'Redis': 'database',
            'Elasticsearch': 'database', 'Docker': 'tool', 'Kubernetes': 'tool', 'Git': 'tool',
            'AWS': 'tool', 'GCP': 'tool', 'Azure': 'tool', 'TensorFlow': 'ai', 'PyTorch': 'ai'
        };

        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            initUploadZone();
        });

        // 上传区域
        function initUploadZone() {
            const zone = document.getElementById('uploadZone');

            zone.addEventListener('click', () => {
                const input = document.createElement('input');
                input.type = 'file';
                input.accept = '.pdf,.docx,.txt';
                input.onchange = (e) => handleFileUpload(e.target.files[0]);
                input.click();
            });

            zone.addEventListener('dragover', (e) => {
                e.preventDefault();
                zone.classList.add('dragover');
            });

            zone.addEventListener('dragleave', () => {
                zone.classList.remove('dragover');
            });

            zone.addEventListener('drop', (e) => {
                e.preventDefault();
                zone.classList.remove('dragover');
                if (e.dataTransfer.files[0]) {
                    handleFileUpload(e.dataTransfer.files[0]);
                }
            });
        }

        // 处理文件上传
        function handleFileUpload(file) {
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (e) => {
                const text = e.target.result;
                // 使用解析器解析简历
                const parsed = parseResume(text);

                const resume = {
                    id: Date.now(),
                    ...parsed,
                    name: parsed.personal_info.name || file.name.replace(/\.[^/.]+$/, ''),
                    title: parsed.personal_info.position || '待定',
                    location: parsed.personal_info.location || '待定',
                    experience: parsed.personal_info.experience_years ? parsed.personal_info.experience_years + '年' : '待定',
                    text: text
                };

                resumes.push(resume);
                updateUI();
                showToast(`简历解析成功！识别到${resume.skills.length}项技能`, 'success');
            };

            if (file.name.endsWith('.txt')) {
                reader.readAsText(file);
            } else {
                // 模拟PDF/DOCX解析，实际项目中会调用后端API
                setTimeout(() => {
                    const demoText = `
姓名：${file.name.replace(/\.[^/.]+$/, '')}
地点：北京
职位：后端工程师

教育背景
2019.09 - 2023.06 北京大学 计算机科学与技术 硕士

工作经历
2023.07 - 至今 字节跳动 后端工程师
负责后端系统开发，使用Go和Python

技能专长
Python, Java, Go, MySQL, Redis, Docker, Kubernetes
`;
                    const parsed = parseResume(demoText);
                    const resume = {
                        id: Date.now(),
                        ...parsed,
                        name: parsed.personal_info.name || file.name.replace(/\.[^/.]+$/, ''),
                        title: '后端工程师',
                        location: '北京',
                        experience: '2年',
                        text: demoText
                    };
                    resumes.push(resume);
                    updateUI();
                    showToast(`简历解析成功！识别到${resume.skills.length}项技能`, 'success');
                }, 1000);
            }
        }

        // ==================== 简历解析器 ====================

        // 技能库（同后端 skill_extractor.py）
        const SKILL_LIBRARY = {
            languages: ['Python', 'Java', 'JavaScript', 'TypeScript', 'C++', 'C#', 'Go', 'Rust', 'Ruby', 'PHP', 'Swift', 'Kotlin', 'Scala', 'Shell', 'SQL', 'HTML', 'CSS'],
            frontend: ['React', 'Vue', 'Angular', 'Next.js', 'Nuxt.js', 'Svelte', 'jQuery', 'Bootstrap', 'Tailwind', 'Element UI', 'Ant Design', 'Vite', 'Webpack', 'Redux', 'Vuex'],
            backend: ['Django', 'Flask', 'FastAPI', 'Spring Boot', 'Spring Cloud', 'Node.js', 'Express', 'Koa', 'NestJS', 'Fastify', 'Ruby on Rails', 'Laravel', 'Gin', 'Beego'],
            database: ['MySQL', 'PostgreSQL', 'MongoDB', 'Redis', 'Elasticsearch', 'Oracle', 'SQL Server', 'SQLite', 'Cassandra', 'Neo4j', 'RabbitMQ', 'Kafka'],
            devops: ['Docker', 'Kubernetes', 'K8S', 'Jenkins', 'GitLab CI', 'GitHub Actions', 'Ansible', 'Terraform', 'Prometheus', 'Grafana', 'ELK'],
            cloud: ['AWS', 'Azure', 'GCP', '阿里云', '腾讯云', '华为云'],
            ai: ['TensorFlow', 'PyTorch', 'Keras', 'Scikit-learn', 'Pandas', 'NumPy', 'OpenCV', 'NLP', '机器学习', '深度学习', 'AI'],
            software: ['Linux', 'Nginx', 'Apache', 'Git', '微服务', '分布式', '高并发', '缓存', '消息队列', '负载均衡', 'CI/CD', 'DevOps', '敏捷开发']
        };

        // 技能分类
        function getSkillType(skill) {
            for (const [type, skills] of Object.entries(SKILL_LIBRARY)) {
                if (skills.includes(skill)) return type;
            }
            return 'other';
        }

        // 解析简历
        function parseResume(text) {
            const resume = {
                personal_info: extractPersonalInfo(text),
                education: extractEducation(text),
                work_experience: extractWorkExperience(text),
                project_experience: extractProjectExperience(text),
                skills: [],
                skills_by_category: {}
            };

            // 提取技能
            resume.skills = extractSkills(text);
            resume.skills_by_category = categorizeSkills(resume.skills);

            // 计算经验年限
            if (resume.work_experience.length > 0) {
                const years = resume.work_experience.reduce((sum, w) => {
                    return sum + calculateYears(w.start_date, w.end_date);
                }, 0);
                resume.personal_info.experience_years = Math.max(1, years);
            }

            return resume;
        }

        // 提取个人信息
        function extractPersonalInfo(text) {
            const info = {};

            const patterns = {
                name: /姓名[：:]\s*(\S+)/,
                phone: /(?:电话|手机|Tel|phone)[：:]\s*(1[3-9]\d{9})/,
                email: /(?:邮箱|Email|E-mail)[：:]\s*([\w.-]+@[\w.-]+\.\w+)/,
                age: /(?:年龄|age)[：:]\s*(\d{1,2})/,
                gender: /(?:性别|gender)[：:]\s*(男|女)/,
                location: /(?:地点|城市|location|所在地)[：:]\s*([^\n]{2,10})/,
                experience: /(?:工作年限|经验|years?|工作经)[：:]\s*(\d+)/,
                salary: /(?:期望薪资|薪资|salary)[：:]\s*([^\n]{2,20})/,
                position: /(?:职位|岗位|title)[：:]\s*([^\n]{2,20})/
            };

            for (const [key, pattern] of Object.entries(patterns)) {
                const match = text.match(pattern);
                if (match) {
                    info[key] = key === 'age' || key === 'experience' ? parseInt(match[1]) : match[1];
                }
            }

            // 默认值
            if (!info.name) {
                const firstLine = text.split('\n')[0].trim();
                if (firstLine && firstLine.length < 20) info.name = firstLine;
            }
            if (!info.location) {
                const cities = ['北京', '上海', '广州', '深圳', '杭州', '南京', '成都', '武汉', '西安', '苏州'];
                for (const city of cities) {
                    if (text.includes(city)) { info.location = city; break; }
                }
            }

            return info;
        }

        // 提取教育经历
        function extractEducation(text) {
            const education = [];
            const lines = text.split('\n');

            const eduKeywords = ['教育背景', '教育经历', 'Education', '学历'];
            const sectionKeywords = ['工作经历', '工作经验', '项目经历', '技能', 'Projects', 'Experience', 'Skills'];

            let inEduSection = false;
            const timePattern = /(\d{4})[./](\d{1,2})\s*[-~至]\s*(?:(\d{4})[./])?(\d{1,2}|至今)/;
            const schools = ['北京大学', '清华大学', '复旦大学', '上海交通大学', '浙江大学', '中国科学技术大学', '南京大学', '武汉大学', '中山大学', '同济大学', '北京航空航天大学', '北京邮电大学', '华中科技大学', '西安交通大学', '哈尔滨工业大学'];
            const degrees = ['博士', '硕士', '本科', '大专'];
            const majors = ['计算机科学与技术', '软件工程', '电子信息工程', '通信工程', '自动化', '数学', '物理学', '经济学', '金融学', '管理学', '工商管理', '人工智能', '数据科学'];

            for (let i = 0; i < lines.length; i++) {
                const line = lines[i].trim();

                // 检查是否进入教育部分
                for (const kw of eduKeywords) {
                    if (line.includes(kw)) { inEduSection = true; continue; }
                }

                // 检查是否离开教育部分
                if (inEduSection) {
                    for (const kw of sectionKeywords) {
                        if (line.startsWith(kw)) {
                            inEduSection = false;
                            break;
                        }
                    }
                }

                if (!inEduSection || !line) continue;

                const edu = {};

                // 时间
                const timeMatch = line.match(timePattern);
                if (timeMatch) {
                    edu.start_date = `${timeMatch[1]}.${timeMatch[2]}`;
                    edu.end_date = timeMatch[4] === '至今' ? '至今' : `${timeMatch[3]}.${timeMatch[4]}`;
                }

                // 学校
                for (const school of schools) {
                    if (line.includes(school)) { edu.school = school; break; }
                }

                // 学历
                for (const deg of degrees) {
                    if (line.includes(deg)) { edu.degree = deg; break; }
                }

                // 专业
                for (const major of majors) {
                    if (line.includes(major)) { edu.major = major; break; }
                }

                if (Object.keys(edu).length > 0) {
                    education.push(edu);
                }
            }

            return education;
        }

        // 提取工作经历
        function extractWorkExperience(text) {
            const workExp = [];
            const lines = text.split('\n');

            const workKeywords = ['工作经历', '工作经验', 'Professional Experience', '工作履历'];
            const sectionKeywords = ['项目经历', '技能', 'Projects', 'Skills', '教育背景', '自我介绍'];

            let inWorkSection = false;
            const timePattern = /(\d{4})[./](\d{1,2})\s*[-~至]\s*(?:(\d{4})[./])?(\d{1,2}|至今)/;

            let currentWork = null;

            for (let i = 0; i < lines.length; i++) {
                const line = lines[i].trim();

                for (const kw of workKeywords) {
                    if (line.includes(kw)) { inWorkSection = true; continue; }
                }

                if (inWorkSection) {
                    for (const kw of sectionKeywords) {
                        if (line.startsWith(kw)) {
                            if (currentWork) workExp.push(currentWork);
                            inWorkSection = false;
                            currentWork = null;
                            break;
                        }
                    }
                }

                if (!inWorkSection || !line) continue;

                const timeMatch = line.match(timePattern);
                if (timeMatch) {
                    if (currentWork) workExp.push(currentWork);

                    currentWork = {
                        start_date: `${timeMatch[1]}.${timeMatch[2]}`,
                        end_date: timeMatch[4] === '至今' ? '至今' : `${timeMatch[3]}.${timeMatch[4]}`,
                        company: '',
                        position: '',
                        description: []
                    };

                    // 公司名
                    const afterTime = line.substring(timeMatch[0].length).trim();
                    if (afterTime) currentWork.company = afterTime;
                } else if (currentWork && line.length > 5) {
                    currentWork.description.push(line);
                }
            }

            if (currentWork) workExp.push(currentWork);

            return workExp;
        }

        // 提取项目经历
        function extractProjectExperience(text) {
            const projects = [];
            const lines = text.split('\n');

            const projKeywords = ['项目经历', '项目经验', 'Projects'];
            const sectionKeywords = ['技能', 'Skills', '工作经历', '教育背景', '自我介绍', '自我评价'];

            let inProjSection = false;
            const timePattern = /(\d{4})[./](\d{1,2})/;

            let currentProj = null;

            for (let i = 0; i < lines.length; i++) {
                const line = lines[i].trim();

                for (const kw of projKeywords) {
                    if (line.includes(kw)) { inProjSection = true; continue; }
                }

                if (inProjSection) {
                    for (const kw of sectionKeywords) {
                        if (line.startsWith(kw)) {
                            if (currentProj && currentProj.name) projects.push(currentProj);
                            inProjSection = false;
                            currentProj = null;
                            break;
                        }
                    }
                }

                if (!inProjSection || !line) continue;

                // 项目名通常比较短且包含"项目"或以动词开头
                if (line.length < 50 && (line.includes('项目') || line.length < 30)) {
                    if (currentProj && currentProj.name) projects.push(currentProj);

                    currentProj = {
                        name: '',
                        time: '',
                        description: []
                    };

                    const timeMatch = line.match(timePattern);
                    if (timeMatch) {
                        currentProj.time = `${timeMatch[1]}.${timeMatch[2]}`;
                        currentProj.name = line.replace(timePattern, '').replace(/项目/g, '').trim();
                    } else {

                }).join('');

            jobSelect.innerHTML = '<option value="">全部岗位</option>' +
                jobs.map(j => `<option value="${j.id}">${j.name} (${j.company})</option>`).join('');
        }

        // 获取技能分类 (用于UI标签颜色)
        function getSkillCategory(skill) {
            const type = getSkillType(skill);
            const categoryMap = {
                languages: 'language',
                frontend: 'framework',
                backend: 'framework',
                database: 'database',
                devops: 'tool',
                cloud: 'tool',
                ai: 'soft',
                software: 'soft',
                other: 'default'
            };
            return categoryMap[type] || 'default';
        }

        // 选择简历
        function selectResume(id) {
            const resume = resumes.find(r => r.id === id);
            if (resume) showDetail(resume, 'resume');
        }

        // 选择岗位
        function selectJob(id) {
            const job = jobs.find(j => j.id === id);
            if (job) showDetail(job, 'job');
        }

        // 显示详情
        function showDetail(item, type) {
            const panel = document.getElementById('detailPanel');
            const content = document.getElementById('detailContent');

            if (type === 'resume') {
                const info = item.personal_info || {};
                const eduList = item.education || [];
                const workList = item.work_experience || [];
                const projList = item.project_experience || [];
                const skillsByCat = item.skills_by_category || {};

                content.innerHTML = `
                    <!-- 基本信息 -->
                    <div class="detail-section">
                        <h3><i class="fas fa-user"></i> 基本信息</h3>
                        <div class="detail-item">
                            <i class="fas fa-user"></i>
                            <span>${info.name || item.name || '未知'}</span>
                        </div>
                        ${info.phone ? `<div class="detail-item"><i class="fas fa-phone"></i><span>${info.phone}</span></div>` : ''}
                        ${info.email ? `<div class="detail-item"><i class="fas fa-envelope"></i><span>${info.email}</span></div>` : ''}
                        ${info.age ? `<div class="detail-item"><i class="fas fa-birthday-cake"></i><span>${info.age}岁</span></div>` : ''}
                        ${info.gender ? `<div class="detail-item"><i class="fas fa-venus-mars"></i><span>${info.gender}</span></div>` : ''}
                        <div class="detail-item">
                            <i class="fas fa-map-marker-alt"></i>
                            <span>${info.location || item.location || '待定'}</span>
                        </div>
                        <div class="detail-item">
                            <i class="fas fa-clock"></i>
                            <span>${info.experience_years ? info.experience_years + '年' : item.experience || '待定'}工作经验</span>
                        </div>
                        ${info.position ? `<div class="detail-item"><i class="fas fa-briefcase"></i><span>${info.position}</span></div>` : ''}
                        ${info.salary ? `<div class="detail-item"><i class="fas fa-money-bill-wave"></i><span>期望薪资: ${info.salary}</span></div>` : ''}
                    </div>

                    <!-- 教育经历 -->
                    ${eduList.length > 0 ? `
                    <div class="detail-section">
                        <h3><i class="fas fa-graduation-cap"></i> 教育经历</h3>
                        ${eduList.map(edu => `
                            <div class="detail-card">
                                <div class="detail-card-header">
                                    <span class="school">${edu.school || '学校待识别'}</span>
                                    <span class="degree">${edu.degree || ''}</span>
                                </div>
                                <div class="detail-card-body">
                                    <span class="major">${edu.major || ''}</span>
                                    <span class="time">${edu.start_date || ''} - ${edu.end_date || ''}</span>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                    ` : ''}

                    <!-- 工作经历 -->
                    ${workList.length > 0 ? `
                    <div class="detail-section">
                        <h3><i class="fas fa-briefcase"></i> 工作经历</h3>
                        ${workList.map(work => `
                            <div class="detail-card">
                                <div class="detail-card-header">
                                    <span class="company">${work.company || '公司待识别'}</span>
                                    <span class="time">${work.start_date || ''} - ${work.end_date || ''}</span>
                                </div>
                                <div class="detail-card-body">
                                    <span class="position">${work.position || ''}</span>
                                </div>
                                ${work.description && work.description.length > 0 ? `
                                <div class="detail-card-desc">
                                    ${work.description.slice(0, 3).map(d => `<p>${d}</p>`).join('')}
                                </div>
                                ` : ''}
                            </div>
                        `).join('')}
                    </div>
                    ` : ''}

                    <!-- 项目经历 -->
                    ${projList.length > 0 ? `
                    <div class="detail-section">
                        <h3><i class="fas fa-project-diagram"></i> 项目经历</h3>
                        ${projList.map(proj => `
                            <div class="detail-card">
                                <div class="detail-card-header">
                                    <span class="project-name">${proj.name || '项目待识别'}</span>
                                    <span class="time">${proj.time || ''}</span>
                                </div>
                                ${proj.description && proj.description.length > 0 ? `
                                <div class="detail-card-desc">
                                    ${proj.description.slice(0, 2).map(d => `<p>${d}</p>`).join('')}
                                </div>
                                ` : ''}
                            </div>
                        `).join('')}
                    </div>
                    ` : ''}

                    <!-- 技能标签 -->
                    <div class="detail-section">
                        <h3><i class="fas fa-cogs"></i> 技能标签 (${(item.skills || []).length}项)</h3>
                        ${Object.entries(skillsByCat).length > 0 ? Object.entries(skillsByCat).map(([category, skills]) => `
                            <div class="skill-category">
                                <div class="skill-category-title">${category}</div>
                                <div class="detail-skills">
                                    ${skills.map(s => `<span class="tag tag-${getSkillCategory(s)}">${s}</span>`).join('')}
                                </div>
                            </div>
                        `).join('') : `
                        <div class="detail-skills">
                            ${(item.skills || []).map(s => `<span class="tag tag-${getSkillCategory(s)}">${s}</span>`).join('')}
                        </div>
                        `}
                    </div>

                    <!-- 能力雷达图 -->
                    <div class="detail-section">
                        <h3><i class="fas fa-chart-pie"></i> 个人能力雷达图</h3>
                        <div style="background: var(--bg-primary); border-radius: var(--radius-md); padding: 16px;">
                            <canvas id="abilityRadarChart" style="max-height: 280px;"></canvas>
                        </div>
                    </div>

                    <!-- 原始文本 -->
                    <div class="detail-section">
                        <h3><i class="fas fa-file-alt"></i> 原始简历</h3>
                        <pre class="raw-text">${item.text || '无'}</pre>
                    </div>
                `;
            } else {
                content.innerHTML = `
                    <div class="detail-section">
                        <h3><i class="fas fa-building"></i> 岗位信息</h3>
                        <div class="detail-item">
                            <i class="fas fa-briefcase"></i>
                            <span>${item.name}</span>
                        </div>
                        <div class="detail-item">
                            <i class="fas fa-building"></i>
                            <span>${item.company}</span>
                        </div>
                        <div class="detail-item">
                            <i class="fas fa-money-bill-wave"></i>
                            <span>${item.salary || '薪资面议'}</span>
                        </div>
                    </div>
                    <div class="detail-section">
                        <h3><i class="fas fa-check-circle"></i> 必备技能</h3>
                        <div class="detail-skills">
                            ${item.required.map(s => `<span class="tag tag-${getSkillCategory(s)}">${s}</span>`).join('')}
                        </div>
                    </div>
                    ${item.preferred ? `
                    <div class="detail-section">
                        <h3><i class="fas fa-star"></i> 加分技能</h3>
                        <div class="detail-skills">
                            ${item.preferred.map(s => `<span class="tag tag-${getSkillCategory(s)}">${s}</span>`).join('')}
                        </div>
                    </div>` : ''}
                `;
            }

            panel.classList.add('open');

            // 渲染能力雷达图
            if (type === 'resume') {
                setTimeout(() => {
                    const abilityVector = calculateAbilityVector(item.skills_by_category || {});
                    const name = item.personal_info?.name || item.name || '候选人';
                    renderAbilityRadar('abilityRadarChart', abilityVector, name);
                }, 100);
            }
        }

        // 关闭详情
        function closeDetail() {
            document.getElementById('detailPanel').classList.remove('open');
        }

        // 运行匹配
        function runMatch() {
            if (resumes.length === 0 || jobs.length === 0) {
                showToast('请先添加简历和岗位！', 'error');
                return;
            }

            const selectedResumeId = document.getElementById('resumeSelect').value;
            const selectedJobId = document.getElementById('jobSelect').value;

            let targetResumes = resumes;
            let targetJobs = jobs;

            if (selectedResumeId) {
                targetResumes = resumes.filter(r => r.id == selectedResumeId);
            }
            if (selectedJobId) {
                targetJobs = jobs.filter(j => j.id == selectedJobId);
            }

            matchResults = [];

            // 匹配算法
            targetResumes.forEach(resume => {
                targetJobs.forEach(job => {
                    const result = calculateMatch(resume, job);
                    matchResults.push(result);
                });
            });

            // 按得分排序
            matchResults.sort((a, b) => b.score - a.score);

            renderResults();
            showToast('匹配完成！', 'success');
        }

        // 批量匹配 - 匹配所有简历到所有岗位
        function runBatchMatch() {
            if (resumes.length === 0 || jobs.length === 0) {
                showToast('请先添加简历和岗位！', 'error');
                return;
            }

            matchResults = [];

            // 所有简历 x 所有岗位的匹配
            resumes.forEach(resume => {
                jobs.forEach(job => {
                    const result = calculateMatch(resume, job);
                    matchResults.push(result);
                });
            });

            // 按得分排序
            matchResults.sort((a, b) => b.score - a.score);

            // 清除选择器选择，使用全部数据
            document.getElementById('resumeSelect').value = '';
            document.getElementById('jobSelect').value = '';

            renderResults();
            showToast(`批量匹配完成！共 ${matchResults.length} 个匹配结果`, 'success');
        }

        // 计算匹配度
        function calculateMatch(resume, job) {
            const required = job.required || [];
            const skills = resume.skills || [];

            let matched = 0;
            const matchedSkills = [];
            const missedSkills = [];

            required.forEach(req => {
                const found = skills.some(s =>
                    s.toLowerCase() === req.toLowerCase()
                );
                if (found) {
                    matched++;
                    matchedSkills.push(req);
                } else {
                    missedSkills.push(req);
                }
            });

            // 计算得分
            const baseScore = required.length > 0 ? (matched / required.length) * 80 : 50;
            const bonus = matchedSkills.length >= 3 ? 10 : 0;
            const score = Math.min(100, Math.round(baseScore + bonus));

            // 生成推荐理由
            let recommendation = '';
            if (score >= 90) {
                recommendation = `完美匹配！该候选人具备${job.name}岗位要求的核心技能${matchedSkills.join('、')}，是理想人选，建议尽快安排面试。`;
            } else if (score >= 70) {
                recommendation = `匹配度良好。候选人具备${matchedSkills.length}项核心技能，建议面试考察${missedSkills.join('、')}等方面的能力。`;
            } else if (score >= 50) {
                recommendation = `匹配度一般。建议详细了解候选人的${missedSkills.join('、')}经验，或考虑其他更匹配的候选人。`;
            } else {
                recommendation = `匹配度较低。候选人技能与岗位要求差异较大，建议寻找更符合岗位需求的其他候选人。`;
            }

            return {
                resume,
                job,
                score,
                matchedSkills,
                missedSkills,
                recommendation,
                rank: 0
            };
        }

        // 渲染结果
        function renderResults() {
            const grid = document.getElementById('resultsGrid');
            const statsRow = document.getElementById('statsRow');

            if (matchResults.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-search"></i>
                        <h3>暂无匹配结果</h3>
                        <p>请选择简历和岗位后点击匹配</p>
                    </div>`;
                return;
            }

            // 统计
            let perfect = 0, good = 0, ok = 0;
            matchResults.forEach(r => {
                if (r.score >= 90) perfect++;
                else if (r.score >= 70) good++;
                else if (r.score >= 50) ok++;
            });

            statsRow.style.display = 'grid';
            document.getElementById('statPerfect').textContent = perfect;
            document.getElementById('statGood').textContent = good;
            document.getElementById('statOk').textContent = ok;
            document.getElementById('statTotal').textContent = matchResults.length;

            // 渲染卡片
            grid.innerHTML = matchResults.map((r, i) => {
                const rankClass = i === 0 ? 'gold' : i === 1 ? 'silver' : i === 2 ? 'bronze' : 'default';
                const scoreClass = r.score >= 90 ? 's' : r.score >= 70 ? 'a' : r.score >= 50 ? 'b' : 'c';
                const scoreColor = r.score >= 90 ? '#10B981' : r.score >= 70 ? '#3B82F6' : r.score >= 50 ? '#F59E0B' : '#EF4444';
                const circumference = 2 * Math.PI * 42;
                const offset = circumference - (r.score / 100) * circumference;

                const resumeName = r.resume.personal_info?.name || r.resume.name || '未知';
                const resumeTitle = r.resume.personal_info?.position || r.resume.title || '待定';
                const resumeLocation = r.resume.personal_info?.location || r.resume.location || '待定';
                const resumeExp = r.resume.personal_info?.experience_years ? r.resume.personal_info.experience_years + '年' : (r.resume.experience || '待定');

                return `
                    <div class="result-card" style="animation-delay: ${i * 80}ms;">
                        <div class="result-rank ${rankClass}">${i + 1}</div>
                        <div class="result-info">
                            <div class="result-name">
                                ${resumeName}
                                <span style="font-weight: 400; font-size: 14px; color: var(--text-secondary);">→ ${r.job.name}</span>
                            </div>
                            <div class="result-title">${resumeTitle} · ${resumeLocation} · ${resumeExp}</div>
                            <div class="result-match-tags">
                                ${r.matchedSkills.slice(0, 4).map(s => `
                                    <span class="match-tag matched"><i class="fas fa-check"></i> ${s}</span>
                                `).join('')}
                                ${r.missedSkills.slice(0, 2).map(s => `
                                    <span class="match-tag missed"><i class="fas fa-times"></i> ${s}</span>
                                `).join('')}
                            </div>
                        </div>
                        <div class="match-score">
                            <div class="score-ring">
                                <svg width="100" height="100">
                                    <circle class="bg" cx="50" cy="50" r="42"/>
                                    <circle class="progress" cx="50" cy="50" r="42"
                                        stroke="${scoreColor}"
                                        stroke-dasharray="${circumference}"
                                        stroke-dashoffset="${offset}"/>
                                </svg>
                                <span class="score-text" style="color: ${scoreColor}">${r.score}</span>
                            </div>
                            <span class="score-label ${scoreClass}">${r.score >= 90 ? 'S级' : r.score >= 70 ? 'A级' : r.score >= 50 ? 'B级' : 'C级'}</span>
                        </div>
                        <div class="recommendation">
                            <h4><i class="fas fa-lightbulb"></i> 推荐理由</h4>
                            <p>${r.recommendation}</p>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // 显示提示
        function showTip(msg) {
            showToast(msg, 'success');
        }

        // Toast 提示
        function showToast(message, type = 'success') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `
                <i class="fas fa-${type === 'success' ? 'check-circle' : 'exclamation-circle'}"></i>
                <span>${message}</span>
            `;
            container.appendChild(toast);

            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateX(100%)';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }
    </script>
</body>
</html>
