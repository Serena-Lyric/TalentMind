name: M2 P4 Evolution

on:
  pull_request:
  push:
    branches: [master]
    paths:
      - ".github/workflows/m2-p4-evolution.yml"
      - "backend/app/job_analysis/**"
      - "backend/tests/test_job_analysis/**"

permissions:
  contents: read

jobs:
  evolution-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install offline dependencies
        run: python -m pip install --disable-pip-version-check httpx==0.27.2 pydantic==2.12.0 pytest==8.3.3
      - name: Compile P4 and direct dependencies
        run: python -m compileall -q app/job_analysis/work_candidates app/job_analysis/knowledge app/job_analysis/baseline
      - name: Verify P0 P1 P2-1 P3 and automatic P4 including real CLI recovery
        run: |
          python -m pytest tests/test_job_analysis/test_baseline*.py \
            tests/test_job_analysis/test_understanding*.py \
            tests/test_job_analysis/test_knowledge*.py \
            tests/test_job_analysis/test_work*.py -q
