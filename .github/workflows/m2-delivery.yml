name: M2 Integrated Delivery

on:
  pull_request:
  push:
    branches: [master]
    paths:
      - '.github/workflows/m2-delivery.yml'
      - 'backend/**'
      - '.gitattributes'

permissions:
  contents: read

jobs:
  offline-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      MYSQL_URL: mysql+pymysql://synthetic:synthetic@127.0.0.1:1/m2_offline
      NEO4J_URI: bolt://127.0.0.1:1
      NEO4J_USER: synthetic
      NEO4J_PASSWORD: synthetic
      REDIS_URL: redis://127.0.0.1:1/15
      OPENAI_API_KEY: offline-not-a-real-key
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Compile integrated entry and direct dependencies
        run: python -m compileall -q app/job_analysis/delivery app/job_analysis/understanding app/job_analysis/knowledge app/job_analysis/work_candidates
      - name: Run all non integration tests with public synthetic fixtures
        run: python -m pytest -m 'not integration' -q --tb=short
