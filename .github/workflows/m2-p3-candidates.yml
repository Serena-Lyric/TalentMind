name: M2 P3 Candidates

on:
  pull_request:
  push:
    branches: [master]
    paths:
      - ".github/workflows/m2-p3-candidates.yml"
      - "backend/app/job_analysis/work_candidates/**"
      - "backend/app/job_analysis/knowledge/**"
      - "backend/app/job_analysis/baseline/**"
      - "backend/app/job_analysis/understanding/**"
      - "backend/tests/test_job_analysis/test_work_candidates*.py"

permissions:
  contents: read

jobs:
  candidate-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install offline test dependencies
        run: python -m pip install --disable-pip-version-check httpx==0.27.2 pydantic==2.12.0 pytest==8.3.3
      - name: Compile P3 and direct dependencies
        run: python -m compileall -q app/job_analysis/work_candidates app/job_analysis/knowledge app/job_analysis/baseline
      - name: Verify lifecycle and affected P1 P2 contracts
        run: |
          python -m pytest tests/test_job_analysis/test_work_candidates.py \
            tests/test_job_analysis/test_work_candidates_cli.py \
            tests/test_job_analysis/test_knowledge_*.py \
            tests/test_job_analysis/test_baseline_contract.py \
            tests/test_job_analysis/test_understanding.py -q
