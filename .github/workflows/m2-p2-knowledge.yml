name: M2 P2 Knowledge and Attribution

on:
  pull_request:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/m2-p2-knowledge.yml"
      - "backend/app/job_analysis/knowledge/**"
      - "backend/app/job_analysis/baseline/contract.py"
      - "backend/app/job_analysis/semantics/models.py"
      - "backend/app/job_analysis/foundation/inputs.py"
      - "backend/tests/test_job_analysis/test_knowledge_*.py"
      - "backend/tests/test_job_analysis/test_baseline_contract.py"
      - "backend/tests/test_job_analysis/test_understanding.py"
      - "backend/tests/test_job_analysis/test_governance.py"

permissions:
  contents: read

jobs:
  knowledge-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install offline test dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            httpx==0.27.2 pydantic==2.12.0 pytest==8.3.3
      - name: Compile knowledge and baseline modules
        run: python -m compileall -q app/job_analysis/knowledge app/job_analysis/baseline
      - name: Run P2-1 baseline and P2-2 attribution offline tests
        run: |
          python -m pytest \
            tests/test_job_analysis/test_knowledge_catalog.py \
            tests/test_job_analysis/test_knowledge_alignment.py \
            tests/test_job_analysis/test_knowledge_roles.py \
            tests/test_job_analysis/test_knowledge_governance.py \
            tests/test_job_analysis/test_knowledge_versions.py \
            tests/test_job_analysis/test_knowledge_cli.py \
            tests/test_job_analysis/test_knowledge_attribution.py \
            tests/test_job_analysis/test_knowledge_attribution_io.py \
            tests/test_job_analysis/test_baseline_contract.py \
            tests/test_job_analysis/test_understanding.py \
            tests/test_job_analysis/test_governance.py \
            -q
